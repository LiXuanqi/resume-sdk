name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  HUSKY: "0"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Build and type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - run: node apps/cli/dist/index.js validate examples/resume.yaml
      - run: node apps/cli/dist/index.js normalize examples/resume.json
      - name: Install PDF test dependencies
        run: |
          pnpm --filter @resume-sdk/pdf exec playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: PDF integration checks
        run: pnpm test:pdf
